# k8s/infra/namespace.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: codeforge-core

---
# to create a separate ns for previews

apiVersion: v1
kind: Namespace
metadata:
  name: codeforge-previews

---
# configmap for shared config values across services

apiVersion: v1
kind: ConfigMap
metadata:
  name: codeforge-shared-config
  namespace: codeforge-core
data:
  PREVIEW_DOMAIN: "previews.codeforge.arclite.site"
  PREVIEW_NAMESPACE: "codeforge-previews"
  PROXY_PORT: "80"
  FRONTEND_URL: "http://codeforge.arclite.site"
  APP_FRONTEND_URL: "http://codeforge.arclite.site"
