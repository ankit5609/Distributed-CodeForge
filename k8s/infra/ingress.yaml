apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codeforge-main-ingress
  namespace: codeforge-core
  annotations:
    # proxy-read-timeout / proxy-send-timeout: Keep long timeouts for WebSocket connections
    # used in the live preview iframe (Vite HMR uses WebSocket). Without these, Nginx
    # would close idle WebSocket connections after the default 60s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # [NEW - 2025-06]: Added proxy-connect-timeout (was missing).
    # Controls how long Nginx waits for the upstream pod to accept a connection.
    # Default is 60s which is fine, but making it explicit here for clarity.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: "nginx"
  rules:
  # 1. Main Website Route (The Frontend!)
  - host: "codeforge.arclite.site"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: codeforge-frontend
            port:
              number: 80
              
  - host: "www.codeforge.arclite.site"
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: codeforge-frontend
            port:
              number: 80

  # 2. Previews Route
  - host: "*.previews.codeforge.arclite.site"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: codeforge-me-proxy
            port:
              number: 80
  
  # 3. API Gateway Route
  - host: "api.codeforge.arclite.site"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80