apiVersion: apps/v1
kind: Deployment
metadata:
  name: codeforge-frontend
  namespace: codeforge-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codeforge-frontend
  template:
    metadata:
      labels:
        app: codeforge-frontend
    spec:
      containers:
        - name: codeforge-frontend
          image: ankit5609/codeforge-frontend:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: codeforge-frontend
  namespace: codeforge-core
spec:
  type: ClusterIP
  selector:
    app: codeforge-frontend
  ports:
    - port: 80
      targetPort: 80